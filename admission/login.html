<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — B.Voc</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body { background: linear-gradient(180deg,#d8dade 0%, #ffffff 100%); color:#e6eef6; font-family: Poppins, sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { width: 380px; border-radius:14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(190, 94, 94, 0.04); box-shadow: 0 10px 30px rgba(220, 221, 227, 0.6); }
    .brand { font-weight:700; letter-spacing:0.6px; }
    .form-control { background: rgba(255,255,255,0.03); color:#e6eef6; border:1px solid rgba(255,255,255,0.06); }
    .form-control:focus { box-shadow:none; border-color:#4f46e5; }
  </style>
</head>
<body>
  <div class="card p-4">
    <div class="text-center mb-3">
      <div class="mb-2"><i class="fa fa-graduation-cap fa-2x" style="color:#7c3aed"></i></div>
      <div class="brand h5">B.Voc Admin</div>
      <div class="text-muted small">Sign in to manage students & courses</div>
    </div>

    <form id="loginForm" class="mt-3">
      <div class="mb-3">
        <label class="form-label small text-muted">Email</label>
        <input type="email" id="email" class="form-control" required placeholder="admin@bvoc.com" />
      </div>

      <div class="mb-3">
        <label class="form-label small text-muted">Password</label>
        <input type="password" id="password" class="form-control" required placeholder="admin123" />
      </div>

      <div class="d-grid">
        <button class="btn btn-primary" id="loginBtn" type="submit">
          <i class="fa fa-sign-in-alt me-2"></i> Sign in
        </button>
      </div>

      <div class="text-center mt-3">
        <small class="text-muted">Demo </small>
      </div>
    </form>
  </div>

<script>
  // Demo: handle login, create a fake JWT and redirect to admin
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // ====== Production: replace this block with a real API call ======
    // Example:
    // const res = await fetch('/api/auth/login', {
    //   method: 'POST', headers: {'Content-Type':'application/json'},
    //   body: JSON.stringify({email,password})
    // });
    // const data = await res.json(); // data.token (JWT)
    // localStorage.setItem('bvoc_token', data.token);
    // window.location = '/admin.html';

    // ===== Demo fake JWT =====
    if (!email || !password) return alert('Enter credentials');
    // create a short "fake" token (not real JWT)
    const fakeToken = btoa(JSON.stringify({email, iat: Date.now()}));
    localStorage.setItem('bvoc_token', fakeToken);
    localStorage.setItem('bvoc_user', email);
    // redirect to admin
    window.location = 'sampleadmin.html';
  });
</script>

</body>
</html>
